<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Охамсмони - Кликер игра</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0c2461, #1e3799);
            color: white;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #3498db;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            color: #f1c40f;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .header .subtitle {
            color: #7f8c8d;
            font-size: 1.2rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            background-color: rgba(52, 152, 219, 0.2);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #3498db;
        }

        .stat {
            text-align: center;
            flex: 1;
        }

        .stat-title {
            font-size: 0.9rem;
            color: #bdc3c7;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f1c40f;
        }

        .legendary-section {
            background: linear-gradient(45deg, #8e44ad, #9b59b6);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid #f1c40f;
        }

        .legendary-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #f1c40f;
        }

        .legendary-value {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
        }

        .level-indicator {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 10px;
            font-size: 1.2rem;
            color: #2ecc71;
        }

        .energy-section {
            background-color: rgba(46, 204, 113, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2ecc71;
        }

        .energy-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #2ecc71;
        }

        .energy-bar-container {
            height: 30px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
            position: relative;
        }

        .energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #1abc9c);
            width: 100%;
            border-radius: 15px;
            transition: width 0.3s;
        }

        .energy-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f1c40f;
        }

        .tap-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 2px dashed #3498db;
            position: relative;
            min-height: 300px;
        }

        .tap-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #f1c40f, #e67e22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #0c2461;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), inset 0 -5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            overflow: hidden;
            border: 5px solid #d35400;
        }

        .tap-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5), inset 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .tap-button-text {
            font-weight: bold;
            z-index: 2;
        }

        .tap-earn {
            position: absolute;
            color: #f1c40f;
            font-weight: bold;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 10;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #bdc3c7;
            cursor: pointer;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
        }

        .nav-button:hover {
            background-color: rgba(52, 152, 219, 0.2);
            color: white;
        }

        .nav-button i {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .nav-button span {
            font-size: 1rem;
        }

        .multiplier {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(231, 76, 60, 0.8);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
            transform: translateX(150%);
            transition: transform 0.5s;
        }

        .notification.show {
            transform: translateX(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .stats-row {
                flex-direction: column;
                gap: 15px;
            }
            
            .tap-button {
                width: 170px;
                height: 170px;
            }
            
            .navigation {
                flex-wrap: wrap;
            }
            
            .nav-button {
                width: 45%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Охамсмони (CEO)</h1>
            <div class="subtitle">Зарабатывай монеты одним кликом!</div>
        </div>
        
        <div class="multiplier" id="multiplier">Множитель: x1</div>
        
        <div class="main-content">
            <div class="stats-row">
                <div class="stat">
                    <div class="stat-title">Заработок за клик</div>
                    <div class="stat-value" id="earn-per-tap">+15</div>
                </div>
                <div class="stat">
                    <div class="stat-title">Монет для уровня</div>
                    <div class="stat-value" id="coins-to-level">50M</div>
                </div>
                <div class="stat">
                    <div class="stat-title">Прибыль в час</div>
                    <div class="stat-value" id="profit-per-hour">+31.93K</div>
                </div>
            </div>
            
            <div class="legendary-section">
                <div class="legendary-title">Легендарный ></div>
                <div class="legendary-value" id="legendary-value">11,439,211</div>
                <div class="level-indicator" id="level-indicator">Уровень 7/9</div>
            </div>
            
            <div class="energy-section">
                <div class="energy-title">Энергия</div>
                <div class="energy-bar-container">
                    <div class="energy-bar" id="energy-bar"></div>
                </div>
                <div class="energy-text" id="energy-text">7500 / 7500</div>
            </div>
            
            <div class="tap-section">
                <div class="tap-button" id="tap-button">
                    <div class="tap-button-text">КЛИК!</div>
                </div>
            </div>
            
            <div class="navigation">
                <div class="nav-button" id="exchange-btn">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Обмен</span>
                </div>
                <div class="nav-button" id="mine-btn">
                    <i class="fas fa-dungeon"></i>
                    <span>Шахта</span>
                </div>
                <div class="nav-button" id="friends-btn">
                    <i class="fas fa-user-friends"></i>
                    <span>Друзья</span>
                </div>
                <div class="nav-button" id="earn-btn">
                    <i class="fas fa-coins"></i>
                    <span>Заработать</span>
                </div>
                <div class="nav-button" id="antitrap-btn">
                    <i class="fas fa-shield-alt"></i>
                    <span>Анти-ловушка</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">Данные сохранены!</div>

    <script>
        // Игровые данные
        let gameData = {
            coins: 11439211,
            coinsPerClick: 15,
            energy: 7500,
            maxEnergy: 7500,
            energyPerClick: 100,
            energyRegenRate: 10, // энергия в секунду
            level: 7,
            maxLevel: 9,
            coinsToNextLevel: 50000000,
            profitPerHour: 31930,
            multiplier: 1,
            lastSave: Date.now()
        };

        // Элементы DOM
        const tapButton = document.getElementById('tap-button');
        const energyBar = document.getElementById('energy-bar');
        const energyText = document.getElementById('energy-text');
        const legendaryValue = document.getElementById('legendary-value');
        const earnPerTap = document.getElementById('earn-per-tap');
        const coinsToLevel = document.getElementById('coins-to-level');
        const profitPerHour = document.getElementById('profit-per-hour');
        const levelIndicator = document.getElementById('level-indicator');
        const multiplierElement = document.getElementById('multiplier');
        const notification = document.getElementById('notification');
        
        // Инициализация
        function initGame() {
            loadGameData();
            updateUI();
            
            // Авто-восстановление энергии
            setInterval(regenerateEnergy, 1000);
            
            // Авто-сохранение каждые 1000мс (1 секунда)
            setInterval(saveGameData, 1000);
            
            // Обновление прибыли в час каждые 10 секунд
            setInterval(updateProfitPerHour, 10000);
        }
        
        // Загрузка данных из localStorage
        function loadGameData() {
            const savedData = localStorage.getItem('ohamsmoniGameData');
            if (savedData) {
                const parsedData = JSON.parse(savedData);
                // Объединяем сохраненные данные с дефолтными (на случай добавления новых полей)
                gameData = {...gameData, ...parsedData};
                console.log('Данные игры загружены');
            }
        }
        
        // Сохранение данных в localStorage
        function saveGameData() {
            gameData.lastSave = Date.now();
            localStorage.setItem('ohamsmoniGameData', JSON.stringify(gameData));
            
            // Показываем уведомление о сохранении (только раз в 10 секунд)
            if (Math.random() > 0.7) {
                showNotification('Данные сохранены!');
            }
        }
        
        // Показать уведомление
        function showNotification(message) {
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }
        
        // Обновление интерфейса
        function updateUI() {
            // Обновляем значения
            legendaryValue.textContent = formatNumber(gameData.coins);
            earnPerTap.textContent = `+${gameData.coinsPerClick * gameData.multiplier}`;
            coinsToLevel.textContent = `${formatNumber(gameData.coinsToNextLevel)}`;
            profitPerHour.textContent = `+${formatNumber(gameData.profitPerHour)}`;
            levelIndicator.textContent = `Уровень ${gameData.level}/${gameData.maxLevel}`;
            
            // Обновляем энергию
            const energyPercent = (gameData.energy / gameData.maxEnergy) * 100;
            energyBar.style.width = `${energyPercent}%`;
            energyText.textContent = `${formatNumber(gameData.energy)} / ${formatNumber(gameData.maxEnergy)}`;
            
            // Обновляем множитель
            multiplierElement.textContent = `Множитель: x${gameData.multiplier}`;
        }
        
        // Форматирование чисел с разделителями
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        
        // Регенерация энергии
        function regenerateEnergy() {
            if (gameData.energy < gameData.maxEnergy) {
                gameData.energy += gameData.energyRegenRate;
                if (gameData.energy > gameData.maxEnergy) {
                    gameData.energy = gameData.maxEnergy;
                }
                updateUI();
            }
        }
        
        // Обновление прибыли в час
        function updateProfitPerHour() {
            // Прибыль зависит от текущего уровня и множителя
            gameData.profitPerHour = Math.floor(15000 * gameData.level * gameData.multiplier * (1 + Math.random() * 0.2));
            updateUI();
        }
        
        // Обработчик клика
        let lastTapTime = 0;
        const tapCooldown = 50; // Минимальное время между кликами (50мс)
        
        tapButton.addEventListener('click', function(e) {
            const currentTime = Date.now();
            
            // Проверка на слишком быстрые клики (анти-маштирование)
            if (currentTime - lastTapTime < tapCooldown) {
                return;
            }
            
            lastTapTime = currentTime;
            
            // Проверка энергии
            if (gameData.energy < gameData.energyPerClick) {
                showNotification('Недостаточно энергии!');
                return;
            }
            
            // Расход энергии
            gameData.energy -= gameData.energyPerClick;
            
            // Начисление монет
            const coinsEarned = gameData.coinsPerClick * gameData.multiplier;
            gameData.coins += coinsEarned;
            
            // Создаем анимацию "+N"
            createCoinAnimation(e, coinsEarned);
            
            // Анимация кнопки
            tapButton.style.transform = 'scale(0.95)';
            setTimeout(() => {
                tapButton.style.transform = 'scale(1)';
            }, 100);
            
            // Проверка уровня
            checkLevelUp();
            
            // Обновление интерфейса
            updateUI();
        });
        
        // Создание анимации "+N"
        function createCoinAnimation(event, amount) {
            const tapX = event.clientX || event.touches[0].clientX;
            const tapY = event.clientY || event.touches[0].clientY;
            
            const plusElement = document.createElement('div');
            plusElement.className = 'tap-earn';
            plusElement.textContent = `+${amount}`;
            plusElement.style.left = `${tapX - 30}px`;
            plusElement.style.top = `${tapY - 30}px`;
            
            document.body.appendChild(plusElement);
            
            // Удаляем элемент после анимации
            setTimeout(() => {
                plusElement.remove();
            }, 1000);
        }
        
        // Проверка повышения уровня
        function checkLevelUp() {
            if (gameData.coins >= gameData.coinsToNextLevel && gameData.level < gameData.maxLevel) {
                gameData.level++;
                gameData.coinsToNextLevel = Math.floor(gameData.coinsToNextLevel * 2.5);
                gameData.coinsPerClick = Math.floor(gameData.coinsPerClick * 1.5);
                gameData.maxEnergy = Math.floor(gameData.maxEnergy * 1.3);
                gameData.energy = gameData.maxEnergy;
                
                // Случайное увеличение множителя (макс x10)
                if (gameData.multiplier < 10 && Math.random() > 0.7) {
                    gameData.multiplier++;
                    showNotification(`Множитель увеличен до x${gameData.multiplier}!`);
                }
                
                showNotification(`Поздравляем! Вы достигли уровня ${gameData.level}!`);
                updateUI();
            }
        }
        
        // Обработчики кнопок навигации
        document.getElementById('exchange-btn').addEventListener('click', function() {
            showNotification('Раздел "Обмен" скоро будет доступен!');
        });
        
        document.getElementById('mine-btn').addEventListener('click', function() {
            showNotification('Раздел "Шахта" скоро будет доступен!');
        });
        
        document.getElementById('friends-btn').addEventListener('click', function() {
            showNotification('Раздел "Друзья" скоро будет доступен!');
        });
        
        document.getElementById('earn-btn').addEventListener('click', function() {
            showNotification('Раздел "Заработать" скоро будет доступен!');
        });
        
        document.getElementById('antitrap-btn').addEventListener('click', function() {
            showNotification('Раздел "Анти-ловушка" скоро будет доступен!');
        });
        
        // Запуск игры
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
